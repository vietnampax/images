<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跳转中...</title>
    
    <!-- 1. 设置 X (Twitter) 卡片效果 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="你的卡片标题">
    <meta name="twitter:description" content="你的卡片描述文本">
    <!-- 卡片上显示的预览大图 URL -->
    <meta name="twitter:image" content="https://raw.githubusercontent.com/vietnampax/images/refs/heads/main/1.jpg">

    <!-- 2. 打开网页后 0 秒自动跳转到目标网址 -->
    <meta http-equiv="refresh" content="2;url=https://dougaclip.com/MLYt7I">
</head>
<body>
    <p>正在跳转，请稍候...</p>
    <script>
        window.location.href = "https://dougaclip.com/MLYt7I";
    </script>
</body>
</html>
